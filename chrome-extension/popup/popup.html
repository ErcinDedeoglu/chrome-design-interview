<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      padding: 12px;
    }
    h1 { font-size: 16px; margin-bottom: 8px; color: #1a73e8; }
    button {
      cursor: pointer; padding: 6px 12px; border: 1px solid #dadce0;
      border-radius: 4px; background: #fff; font-size: 13px;
    }
    button:hover { background: #f1f3f4; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    button.primary:hover { background: #1557b0; }
    button.danger { color: #d93025; border-color: #d93025; }
    .status { padding: 6px 8px; border-radius: 4px; margin: 8px 0; font-weight: 600; }
    .status.on { background: #e6f4ea; color: #1e8e3e; }
    .status.off { background: #fce8e6; color: #d93025; }
    .actions { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    .comment-list { max-height: 300px; overflow-y: auto; margin: 8px 0; }
    .comment-item {
      padding: 6px 8px; border: 1px solid #e8eaed; border-radius: 4px;
      margin-bottom: 6px; background: #fff;
    }
    .comment-item .meta { font-size: 11px; color: #5f6368; }
    .comment-item .text { margin: 4px 0; }
    .empty { color: #80868b; font-style: italic; padding: 12px 0; text-align: center; }
  </style>
</head>
<body>
  <h1>UX Feedback</h1>
  <div id="status" class="status off">Feedback mode: OFF</div>
  <div class="actions">
    <button id="toggle-btn" class="primary">Toggle Mode</button>
    <button id="export-btn">Export JSON</button>
    <button id="copy-btn">Copy Text</button>
  </div>
  <div class="comment-list" id="comment-list">
    <div class="empty">No comments yet. Toggle mode and click an element.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
